name: eval-gate

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests + eval gate
        env:
          AGENT_LLM: heuristic
        run: pytest
      - name: Enqueue + worker
        if: always()
        env:
          AGENT_LLM: heuristic
        run: |
          python -m agent_trace_eval.worker enqueue --span-diff
          python -m agent_trace_eval.worker once
      - name: Scorecard
        if: always()
        env:
          AGENT_LLM: heuristic
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent_trace_eval.scorecard --comment
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-traces
          path: |
            artifacts/traces.jsonl
            artifacts/scorecard.md
            eval/last_report.json
          if-no-files-found: ignore
